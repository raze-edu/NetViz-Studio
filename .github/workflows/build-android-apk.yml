name: Build Android Companion APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          gradle-home-cache-cleanup: true

      - name: Run Android JUnit tests & assemble debug APK
        working-directory: android_app
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload NetVizSurvey-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: NetVizSurvey-debug.apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
